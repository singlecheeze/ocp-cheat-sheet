apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: open-webui-guardrails-view
  namespace: gemma
subjects:
  - kind: ServiceAccount
    name: open-webui
    namespace: gemma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-guardrails-token
  namespace: gemma
  annotations:
    kubernetes.io/service-account.name: open-webui
type: kubernetes.io/service-account-token
