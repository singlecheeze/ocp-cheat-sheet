apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: 100gb-bond-nnc
spec:
  nodeSelector:
    node-role.kubernetes.io/master: ""
  desiredState:
    interfaces:
      - name: enp1s0f0np0
        type: ethernet
        state: up
        mtu: 9100
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: enp1s0f1np1
        type: ethernet
        state: up
        mtu: 9100
        ipv4:
          enabled: false
        ipv6:
          enabled: false
      - name: bond1
        type: bond
        state: up
        mtu: 9100
        ipv4:
          enabled: false
        ipv6:
          enabled: false
        link-aggregation:
          mode: 802.3ad
          options:
            miimon: "100"
            lacp_rate: fast
            xmit_hash_policy: layer3+4
          port:
            - enp1s0f0np0
            - enp1s0f1np1