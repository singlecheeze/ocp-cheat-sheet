apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: set-jumbo-mtu
spec:
  nodeSelector:
    kubernetes.io/os: linux
  desiredState:
    interfaces:
      - mtu: 9100
        name: eno1
        type: ethernet
      - mtu: 9100
        name: usb0
        type: ethernet
      - mtu: 9100
        name: enp193s0f0np0
        type: ethernet
      - mtu: 9100
        name: enp193s0f1np1
        type: ethernet